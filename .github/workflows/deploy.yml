name: Deploy to Synology NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (clone-or-pull + write .env + docker compose up -d --build)
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            export PATH="/usr/local/bin:/usr/local/sbin:/usr/syno/bin:/var/packages/ContainerManager/target/usr/bin:/var/packages/Docker/target/usr/bin:/var/packages/Git/target/usr/bin:$PATH"
            REPO_URL="https://github.com/roomhs-hub/bodapath.git"
            DEPLOY_PATH="${{ secrets.NAS_DEPLOY_PATH }}"
            git config --global --add safe.directory "$DEPLOY_PATH"
            if [ -d "$DEPLOY_PATH/.git" ]; then
              cd "$DEPLOY_PATH"
              git pull
            else
              mkdir -p "$DEPLOY_PATH"
              git clone "$REPO_URL" "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            fi
            printf '%s' "$ENV_FILE_CONTENT" > "$DEPLOY_PATH/.env"
            sudo -n docker compose up -d --build
            echo "=== docker compose ps ==="
            sudo -n docker compose ps
            echo "=== app container logs (last 300 lines) ==="
            sudo -n docker compose logs app --tail=300 --no-color
